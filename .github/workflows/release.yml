name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Pilgrimz Tour Map WordPress Plugin v${{ steps.get_version.outputs.VERSION }}

            ### Installation

            1. Download the plugin files from this release
            2. Upload to your WordPress `/wp-content/plugins/` directory
            3. Activate the plugin in WordPress admin

            ### Usage

            ```
            [pilgrimz-tour-map tour-id="123"]
            ```

            See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full documentation.

            ---

            **Changelog**: See commit history for details on what changed in this release.
          draft: false
          prerelease: false
